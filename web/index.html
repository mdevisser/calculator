<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Workbench</title>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<div class="wrap">
  <h1>Math Workbench</h1>
  <p class="sub">Taking apart the big AI-era math results, one at a time.</p>

  <h2>The path</h2>
  <ol class="path" id="path"></ol>

  <section id="news">
    <h2>News</h2>
    <p>News watch arrives in a later update.</p>
  </section>

  <footer>
    <a href="checks.html">check ledger</a>
    &middot; <a href="calculator.html">calculator</a>
  </footer>
</div>
<script src="./lessons.js"></script>
<script src="./lesson-model.js"></script>
<script>
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  const list = document.getElementById('path');
  for (const p of pathModel(globalThis.LESSONS)) {
    const li = el('li');
    // An unavailable lesson is shown but never linked, so the path can't 404.
    const step = p.href ? el('a', 'path-step') : el('div', 'path-step unavailable');
    if (p.href) step.href = p.href;

    step.appendChild(el('span', 'num', String(p.position)));
    step.appendChild(el('span', 'title', p.title));
    step.appendChild(el('span', 'blurb', p.blurb));

    const meta = el('span', 'meta');
    const chip = el('span', 'label-chip', p.labelText);
    if (p.labelText === 'Unverified claim') chip.classList.add('unverified');
    meta.appendChild(chip);
    if (!p.confirmed) meta.appendChild(el('span', 'unconfirmed', 'not yet confirmed against primary sources'));
    if (!p.href) meta.appendChild(el('span', 'soon', 'coming soon'));
    step.appendChild(meta);

    li.appendChild(step);
    list.appendChild(li);
  }
</script>
</body>
</html>
